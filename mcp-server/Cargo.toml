[package]
name = "mcp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = [ "runtime-tokio", "sqlite", "macros", "chrono" ] }
chrono = { version = "0.4", features = ["serde"] }
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
reqwest = "0.13.5"
anyhow = "1.0.104"
schemars = "1.2.3"

[package]
name = "meta_ai_agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dotenv = "0.15.0"
figlet-rs = "1.0.0"
futures = "0.3.34"
inquire = "0.9.4"
nu-ansi-term = "0.50.3"
rig = "0.46.0"
rig-core = "0.46.0"
rig-rmcp ="0.46.0"
rmcp = { version = "3.8.0", features = ["transport-io", "transport-child-process"] }
tokio = { version = "1.53.3", features = ["full"] }
